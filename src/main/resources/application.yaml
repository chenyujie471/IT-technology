spring:
  application:
    name: IT-technology
  mvc:
    async:
      request-timeout: 660000   # 660s，覆盖图像生成最长 600s
  servlet:
    multipart:
      max-file-size: 20MB       # 图像编辑参考图单文件上限
      max-request-size: 80MB    # 4 张参考图的总上限
  # 请求日志持久化数据源
  # 默认：H2 文件模式（零配置，重启不丢，文件在 ./data/reqlog）
  # 使用 MySQL：--spring.profiles.active=mysql，并在下方覆盖 url/username/password
  datasource:
    url: jdbc:h2:file:./data/db;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: embedded
      schema-locations: classpath:schema1.sql

server:
  port: 8035

ai:
  upstream: https://ai-api.kkidc.com        # 国内站
  upstream-intl: https://www.aiide.com      # 国际站
  # 访问密钥（安全开关）：填写后所有 /api/** 请求必须在 X-Access-Key 头带上相同值，
  # 否则返回 403。留空则关闭校验（默认开放，适合内网自测）。
  access-key: ""
  # 允许的跨域来源；留空则仅允许同源访问，如需外部前端可填列表，如 ["https://a.com"]
  cors-allowed-origins: []
  # ---- 模型广场 ----
  plaza:
    # 全量模型定价数据源（new-api /api/pricing），返回含官网广场未展示（隐藏/海外）的模型
    pricing-url: https://www.kkhub.com/api/pricing
    # 系统访问令牌：非空时以 Authorization: Bearer <token> 请求上游。
    # 令牌只保存在服务端配置里，不会下发给浏览器。
    token: +7aQhceXtTDmt5kMg1rnx/tK+14Gmw==
    # 结果缓存秒数，避免每次打开广场都请求上游
    cache-seconds: 300

logging:
  level:
    com.example.ittechnology: DEBUG
